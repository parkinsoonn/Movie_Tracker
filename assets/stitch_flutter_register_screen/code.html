        /* Animated Background Elements */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            z-index: -1;
            animation: float 20s infinite alternate ease-in-out;
        }
        
        .bg-blob-1 {
            width: 500px;
            height: 500px;

            top: -100px;
            left: -100px;

        }

            width: 400px;
            height: 400px;
            background: #FFC107;
            bottom: -50px;
            right: -50px;

        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }

<script>
        // Simple script for UI interactions (e.g., password toggle)
        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtn = document.querySelector('[aria-label="Toggle password visibility"]');
            const passwordInput = document.getElementById('password');
            const iconSpan = togglePasswordBtn.querySelector('span');

            if(togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', () => {
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        iconSpan.textContent = 'visibility';
                        iconSpan.classList.add('text-primary');
                    } else {
                        passwordInput.type = 'password';
                        iconSpan.textContent = 'visibility_off';
                        iconSpan.classList.remove('text-primary');
                    }
                });
            }
            
            // Add subtle parallax effect to abstract blobs
            document.addEventListener('mousemove', (e) => {
                const blobs = document.querySelectorAll('.bg-blob');
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                
                blobs[0].style.transform = `translate(${x * 30}px, ${y * 30}px)`;
                blobs[1].style.transform = `translate(${x * -40}px, ${y * -40}px)`;
            });
        });
    </script>
