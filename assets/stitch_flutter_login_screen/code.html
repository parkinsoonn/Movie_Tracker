<style>
        body {
            background-color: #121212;
            background-image: radial-gradient(circle at 50% 0%, rgba(138, 43, 226, 0.1) 0%, transparent 50%), 
                              radial-gradient(circle at 50% 100%, rgba(255, 179, 0, 0.05) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .glass-panel {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .gradient-btn {
            background: linear-gradient(90deg, #8A2BE2 0%, #FFB300 100%);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
            transition: all 0.3s ease;
        }
        
        .gradient-btn:hover {
            box-shadow: 0 6px 20px rgba(255, 179, 0, 0.4);
            transform: translateY(-2px);
        }

        .input-field {
            background-color: #1E1E1E;
            border: 1px solid #2A2A2A;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: #8A2BE2;
            box-shadow: 0 0 0 2px rgba(138, 43, 226, 0.2);
            outline: none;
        }

<style>
    body {
      min-height: max(884px, 100dvh);

<body class="text-on-background font-body-lg antialiased">
<!-- Top AppBar (Brand Only for Login) -->
<header class="flex items-center justify-center px-gutter h-24 w-full z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">movie_filter</span>
<span class="font-display-lg text-title-md tracking-[0.2em] text-primary uppercase">CINEPHILE</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-container-padding py-section-gap">
<div class="w-full max-w-md glass-panel rounded-2xl p-8 md:p-12 relative overflow-hidden">
<!-- Subtle rim light effect -->
<div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
<!-- Hero Section -->
<div class="text-center mb-stack-lg">
<h1 class="font-headline-lg text-headline-lg md:text-display-lg text-on-surface mb-stack-sm">Welcome Back</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant opacity-80">Your private screening starts here.</p>
</div>
<!-- Login Form -->
<form class="space-y-stack-md flex flex-col">
<!-- Email Input -->
<div class="relative">
<label class="sr-only" for="email">Email Address</label>
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant opacity-50">mail</span>
</div>
<input class="input-field w-full rounded-lg py-4 pl-12 pr-4 text-on-surface font-body-lg placeholder-on-surface-variant/50 focus:ring-0" id="email" name="email" placeholder="Email Address" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="relative">
<label class="sr-only" for="password">Password</label>
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant opacity-50">lock</span>
</div>
<input class="input-field w-full rounded-lg py-4 pl-12 pr-12 text-on-surface font-body-lg placeholder-on-surface-variant/50 focus:ring-0" id="password" name="password" placeholder="Password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined opacity-70">visibility</span>
</button>
</div>
<!-- Forgot Password -->
<div class="flex justify-end pt-2">
<a class="font-body-sm text-body-sm text-[#FFB300] hover:text-white transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full gradient-btn rounded-full py-4 text-white font-title-md text-title-md flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer -->
<div class="mt-stack-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? <a class="text-[#FFB300] font-semibold hover:underline decoration-2 underline-offset-4" href="#">Sign Up</a>
</p>
</div>
</div>
</main>
<!-- Navigation shells (TopAppBar & BottomNavBar) are suppressed as this is a linear/transactional Login screen -->
</body></html>
