<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cinephile Movie Card</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#353535",

                        "on-tertiary-fixed": "#1b1c1c",
                        "surface-container-highest": "#353535",
                        "outline": "#999077",
                        "surface-dim": "#131313",
                        "background": "#131313",
                        "primary": "#fff6df",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed": "#e4e2e1",
                        "on-secondary-fixed-variant": "#454747",
                        "tertiary": "#f8f6f5",
                        "on-primary": "#3a3000",
                        "on-primary-fixed-variant": "#544600",
                        "surface": "#131313",
                        "surface-container": "#202020",
                        "on-surface-variant": "#d0c6ab",

                        "on-tertiary-container": "#5f5f5f",

                        "primary-fixed": "#ffe16d",

                        "on-primary-container": "#705e00",
                        "on-tertiary-fixed-variant": "#474747",
                        "on-secondary-container": "#b4b5b5",
                        "on-secondary": "#2f3131",
                        "on-secondary-fixed": "#1a1c1c",
                        "tertiary-container": "#dcd9d9",
                        "secondary-fixed-dim": "#c6c6c7",
                        "secondary": "#c6c6c7",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "container-padding": "24px",
                        "stack-sm": "12px",
                        "stack-lg": "40px",
                        "gutter": "16px",
                        "stack-md": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Be Vietnam Pro", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "headline-lg": ["Be Vietnam Pro", "sans-serif"],
                        "label-md": ["JetBrains Mono", "monospace"],
                        "body-md": ["Inter", "sans-serif"],
                        "headline-lg-mobile": ["Be Vietnam Pro", "sans-serif"],
                        "label-sm": ["JetBrains Mono", "monospace"],
                        "display-lg": ["Be Vietnam Pro", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500" }],

                }
            }
        }

<style>
        .neon-glow {
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
        }
        .inner-stroke {
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        }
        .aspect-poster {
            aspect-ratio: 2 / 3;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex items-center justify-center p-6 text-on-background">
<!-- Movie Card Widget Container -->
<div class="w-full max-w-sm rounded-xl overflow-hidden bg-surface-container-high shadow-2xl shadow-black/50 inner-stroke group cursor-pointer transition-transform duration-300 hover:scale-[1.02]">
<!-- Poster Area -->
<div class="relative w-full aspect-poster bg-surface-container-highest overflow-hidden">
<img alt="Movie Poster" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" data-alt="A moody, high-contrast cinematic movie poster featuring a solitary silhouette standing in a rainy, neon-lit cyberpunk alleyway. The scene is bathed in deep blues and striking gold highlights, embodying a neo-noir aesthetic. The composition is dramatic, focusing on atmosphere and mystery, suitable for a premium private screening application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAuRAesxgXEmiCt4OIgMihC_CoLrZUCzfhhBOvV32x9lBtLkPV1oNb9OvjJfYs4gsQvhtevh-J8lTK6Ou7Xo_ANxdHgMxGC3QyZh_mB5AdxtQQqmi7OnambMbnOP07J8qNIosa10I6IvOIUmU6lfIO2CRmP_xNMhitiERirKJPB5tIu8dFqMrCm8wcvBZqFhFN7V60vybj5j31lXZov8aBd4Gaq91vWu8G1uHdx0X_smbpGf2R5BWDw_7nad40N6VURAZchjo9ceQ5Y"/>
<!-- Gradient Overlay for legibility if needed later -->
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-high via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<!-- Quick Action Overlay (Optional/Hover) -->
<div class="absolute top-4 right-4 bg-background/80 backdrop-blur-md rounded-full p-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 inner-stroke text-on-surface-variant hover:text-primary-container">
<span class="material-symbols-outlined" data-icon="bookmark">bookmark</span>
</div>
</div>
<!-- Metadata Area -->
<div class="p-4 flex flex-col gap-2">
<!-- Title & Year -->
<div>
<h3 class="font-headline-md text-headline-md text-on-surface line-clamp-2" title="Blade Runner 2049">
                    Blade Runner 2049
                </h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">
                    2017
                </p>
</div>
<!-- Rating & Action -->
<div class="flex items-center justify-between mt-2 pt-2 border-t border-outline-variant/30">
<div class="flex items-center gap-1.5 text-primary-container">
<span class="material-symbols-outlined" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-label-md text-label-md font-bold">8.5</span>
</div>
<!-- Secondary Info (Optional) -->
<div class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">
                    Sci-Fi
                </div>
</div>
</div>
</div>
</body></html>
